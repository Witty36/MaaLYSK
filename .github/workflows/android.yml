name: Android APK (MaaFwApp)

# 手动 dispatch 出 debug 包（artifact，不发布）；
# install.yml 建完 Release 后派发 android-release，出正式包并上传到同一个 Release。
on:
  workflow_dispatch:
    inputs:
      assemble:
        description: debug 或 release（release 需要签名 secrets）
        type: choice
        options:
          - debug
          - release
        default: debug
      agent_core_tag:
        description: "应急：手动指定 MaaAgentCoreAndroid 内核 tag；留空自动解析"
        required: false
        default: ""
  repository_dispatch:
    types: [android-release]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: MaaLYSK
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || '' }}
  AGENT_CORE_REPO: Aliothmoon/MaaAgentCoreAndroid
  MAAFW_REPO: MaaXYZ/MaaFramework
  SHELL_REPO: Aliothmoon/MaaFwApp
  # 与 Android/patches/maafwapp-maalysk.patch 的基线保持一致
  SHELL_REF: f29a0b0d5e5ebdc845368f0e98e8104911765c1a
  PYTHONUTF8: "1"

jobs:
  build-android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: x86_64
            arch: x64

    steps:
      - name: Checkout MaaLYSK
        uses: actions/checkout@v4
        with:
          path: resource-source
          # repository_dispatch 跑在默认分支上，显式切到 Release 对应的 tag
          ref: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout MaaFwApp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SHELL_REPO }}
          ref: ${{ env.SHELL_REF }}
          path: maafw-source

      - name: Apply portrait patch
        run: |
          patch="$GITHUB_WORKSPACE/resource-source/Android/patches/maafwapp-maalysk.patch"
          git -C maafw-source apply --check "$patch"
          git -C maafw-source apply "$patch"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;3.22.1'
          # Android 17 的 platform 包名在不同 cmdline-tools 版本下可能是 37.0 或 37
          sdkmanager 'platforms;android-37.0' || sdkmanager 'platforms;android-37'
          python -m pip install --upgrade pip packaging

      - name: Resolve versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_CORE_TAG: ${{ github.event.inputs.agent_core_tag || vars.AGENT_CORE_TAG || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            build_type=release
            version="$RELEASE_TAG"
            application_id="com.aliothmoon.maafw.maalysk"
            app_id_suffix="maalysk"
            app_label="MaaLYSK"
          else
            build_type="${{ github.event.inputs.assemble || 'debug' }}"
            version="ci.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            application_id="com.aliothmoon.maafw.maalysk.ci"
            app_id_suffix="maalysk.ci"
            app_label="MaaLYSK · CI"
          fi
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))

          gh api "repos/$AGENT_CORE_REPO/releases" --paginate --jq '.[].tag_name' \
            > "$RUNNER_TEMP/core-tags.txt"
          gh api "repos/$MAAFW_REPO/releases" --paginate --jq '.[].tag_name' \
            > "$RUNNER_TEMP/maafw-tags.txt"
          python resource-source/Android/resolve_versions.py \
            --requirements resource-source/requirements.txt \
            --shell-source maafw-source \
            --core-tags "$RUNNER_TEMP/core-tags.txt" \
            --maafw-tags "$RUNNER_TEMP/maafw-tags.txt" \
            --agent-core-tag "$AGENT_CORE_TAG" \
            --github-output "$GITHUB_OUTPUT"

          {
            echo "build_type=$build_type"
            echo "version=$version"
            echo "version_code=$version_code"
            echo "application_id=$application_id"
            echo "app_id_suffix=$app_id_suffix"
            echo "app_label=$app_label"
          } >> "$GITHUB_OUTPUT"

      - name: Configure OCR models
        run: |
          python resource-source/tools/ci/configure.py
          for name in det.onnx rec.onnx keys.txt; do
            test -s "resource-source/assets/resource/base/model/ocr/$name"
          done

      - name: Test Android packaging scripts
        run: python -m unittest discover -s resource-source/Android/tests -v

      - name: Stage MaaLYSK payload
        run: |
          python resource-source/Android/prepare.py \
            --version "${{ steps.version.outputs.version }}" \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --maafw-version "${{ steps.version.outputs.maafw_version }}" \
            --agent-core-tag "${{ steps.version.outputs.core_tag }}" \
            --abi "${{ matrix.abi }}" \
            --shell-source "$GITHUB_WORKSPACE/maafw-source" \
            --work "$GITHUB_WORKSPACE/resource-source/Android/.build"

      - name: Cache MaaFwApp agent core
        uses: actions/cache@v4
        with:
          path: maafw-source/.maafw
          key: maa-agent-core-${{ runner.os }}-${{ matrix.abi }}-${{ steps.version.outputs.core_tag }}-${{ hashFiles('maafw-source/scripts/build_agent_bundle.py') }}

      - name: Build agent runtime
        run: |
          python maafw-source/scripts/build_agent_bundle.py \
            --out "$GITHUB_WORKSPACE/resource-source/Android/.build/agent-dist" \
            --abi "${{ matrix.abi }}" \
            --core-tag "${{ steps.version.outputs.core_tag }}" \
            --requirements "$GITHUB_WORKSPACE/resource-source/requirements.txt"

      - name: Deploy MaaFramework
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python maafw-source/scripts/setup_maa_framework.py \
            --tag "${{ steps.version.outputs.maafw_tag }}" \
            --abi "${{ matrix.abi }}"

      - name: Write local.properties
        run: |
          cat > maafw-source/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          build.debugAbi=${{ matrix.abi }}
          build.releaseAbi=${{ matrix.abi }}
          EOF

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        id: keystore
        if: steps.version.outputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::release 构建缺少 secret $name"
              exit 1
            fi
          done
          path="$RUNNER_TEMP/maalysk-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: maafw-source
        env:
          PI_PROFILE: ${{ github.workspace }}/resource-source/Android/profile.yaml
          BUILD_VERSION_NAME: ${{ steps.version.outputs.version }}
          BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MAALYSK_APP_ID: ${{ steps.version.outputs.app_id_suffix }}
          MAALYSK_APP_LABEL: ${{ steps.version.outputs.app_label }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          task=assembleDebug
          if [[ "${{ steps.version.outputs.build_type }}" == "release" ]]; then
            task=assembleRelease
          fi
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process ":app:$task"

      - name: Verify APK
        env:
          CERT: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          build_type="${{ steps.version.outputs.build_type }}"
          apk="maafw-source/app/build/outputs/apk/$build_type/app-$build_type.apk"
          extra=()
          if [[ -n "$CERT" ]]; then
            extra+=(--certificate-sha256 "$CERT")
          fi
          python resource-source/Android/verify_apk.py "$apk" \
            --abi "${{ matrix.abi }}" \
            --version "${{ steps.version.outputs.version }}" \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --package-id "${{ steps.version.outputs.application_id }}" \
            --label "${{ steps.version.outputs.app_label }}" \
            --maafw-version "${{ steps.version.outputs.maafw_version }}" \
            --output android-artifacts \
            --name "MaaLYSK-android-${{ matrix.arch }}-${{ steps.version.outputs.version }}.apk" \
            --sdk "$ANDROID_HOME" \
            "${extra[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaaLYSK-android-${{ matrix.arch }}
          path: android-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK to GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release upload "$TAG" android-artifacts/*.apk android-artifacts/*.sha256 --clobber

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/maalysk-release.jks"
